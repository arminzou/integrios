version: 2
updates:
  - package-ecosystem: npm
    directory: /src/Integrios.Admin/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend:
        update-types: [minor, patch]
    # Major upgrades are planned work; security updates still arrive regardless.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Docs site tooling; nothing here ships in a release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # No central package management: the solution at the root reaches every project.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Keep the SDK's dependency floor at 10.0.0 so consumers can choose their patch version.
      - dependency-name: Microsoft.Extensions.Hosting.Abstractions
      - dependency-name: Microsoft.Extensions.Http

  # The image and the Windows archive bundle the .NET runtime, so a runtime patch reaches Operators
  # only as an Integrios release. `fix` makes release-please cut a patch release for it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # The pin is the minimum SDK. Holding it on the 1xx band keeps a machine with only a 1xx SDK
      # building; CI and the image build on the newest band, which global.json's latestFeature allows.
      - dependency-name: "*"
        versions: [">= 10.0.200"]
