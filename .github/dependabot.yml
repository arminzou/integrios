version: 2
updates:
  - package-ecosystem: npm
    directory: /src/Integrios.Admin/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend:
        update-types: [minor, patch]
    # Major upgrades are planned work; security updates still arrive regardless.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # No central package management: the solution at the root reaches every project.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
