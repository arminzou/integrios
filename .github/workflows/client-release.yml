name: client-release

# Publishes the Integrios.Client SDK to nuget.org. Release-please versions the SDK apart from the
# server and tags its releases client-v*, which ci.yml's v* release run does not match.
# The client's GitHub release carries no assets: nuget.org is the SDK's channel. GitHub marks the
# newest release Latest, so the last step hands that badge back to the newest server release.

on:
  push:
    tags: ['client-v*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing: NuGet/login trades this OIDC token for a short-lived API key.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore tests/Integrios.Client.UnitTests/Integrios.Client.UnitTests.csproj --locked-mode

      - name: Test
        run: dotnet test tests/Integrios.Client.UnitTests/Integrios.Client.UnitTests.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/Integrios.Client/Integrios.Client.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -o out

      - name: Check the package version matches the tag
        run: test -f "out/Integrios.Client.${GITHUB_REF_NAME#client-v}.nupkg"

      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Restore the Latest badge to the server release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          server_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName |
            jq -r '.[] | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 1)
          if [[ -z "$server_tag" ]]; then
            echo "No stable server release found."
            exit 0
          fi
          gh release edit "$server_tag" --latest
