name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Integrios.slnx

      - name: Build
        run: dotnet build Integrios.slnx --configuration Release --no-restore

      # Unit test projects only. The integration test project needs Postgres and
      # is run out of band, not in this gate.
      - name: Test
        run: |
          dotnet test tests/Integrios.Ingress.Tests/Integrios.Ingress.Tests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Admin.Tests/Integrios.Admin.Tests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Worker.Tests/Integrios.Worker.Tests.csproj --configuration Release --no-build

  # Build and publish images, only on push to the canonical repo (merges/tags on
  # GitHub). Fork PRs never reach this job, so no secrets are exposed to them.
  package:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # MockSink is a local test/demo aid, not a deployable service, so it is
        # compile-verified in the verify job but never published.
        service:
          - name: ingress
            dockerfile: docker/Ingress.Dockerfile
          - name: admin
            dockerfile: docker/Admin.Dockerfile
          - name: worker
            dockerfile: docker/Worker.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
