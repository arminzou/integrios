name: ci

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore Integrios.slnx --locked-mode

      - name: Audit runtime dependencies
        run: dotnet list Integrios.slnx package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build Integrios.slnx --configuration Release --no-restore

      - name: Test architecture and unit tiers
        run: |
          dotnet test tests/Integrios.ArchitectureTests/Integrios.ArchitectureTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Domain.UnitTests/Integrios.Domain.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Application.UnitTests/Integrios.Application.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Infrastructure.UnitTests/Integrios.Infrastructure.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Admin.UnitTests/Integrios.Admin.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Ingestion.UnitTests/Integrios.Ingestion.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Worker.UnitTests/Integrios.Worker.UnitTests.csproj --configuration Release --no-build

  functional:
    name: functional (${{ matrix.database-provider }})
    needs: verify
    runs-on: ubuntu-latest
    # The tier now starts a real Service Bus emulator alongside the database container; a broker
    # that never becomes ready would otherwise burn the six-hour default before failing.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database-provider: [postgres, sqlserver]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore tests/Integrios.Application.FunctionalTests/Integrios.Application.FunctionalTests.csproj --locked-mode

      - name: Build
        run: dotnet build tests/Integrios.Application.FunctionalTests/Integrios.Application.FunctionalTests.csproj --configuration Release --no-restore

      - name: Test ${{ matrix.database-provider }} functional tier
        env:
          INTEGRIOS_TEST_DATABASE_PROVIDER: ${{ matrix.database-provider }}
        run: >
          dotnet test tests/Integrios.Application.FunctionalTests/Integrios.Application.FunctionalTests.csproj
          --configuration Release --no-build

  qualify:
    needs: [verify, functional]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Restore
        run: dotnet restore Integrios.slnx --locked-mode

      - name: Select acceptance run
        id: tier
        shell: bash
        run: |
          # The qualify job itself does not run on pull_request (see the job-level `if`); PRs
          # stop at the functional tier. What remains distinguishes only release, which runs the
          # whole solution, from main and nightly, which run the acceptance project whole.
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            echo 'name=nightly' >> "$GITHUB_OUTPUT"
            echo 'target=tests/Integrios.AcceptanceTests/Integrios.AcceptanceTests.csproj' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo 'name=release' >> "$GITHUB_OUTPUT"
            echo 'target=Integrios.slnx' >> "$GITHUB_OUTPUT"
          else
            echo 'name=main' >> "$GITHUB_OUTPUT"
            echo 'target=tests/Integrios.AcceptanceTests/Integrios.AcceptanceTests.csproj' >> "$GITHUB_OUTPUT"
          fi

      # The deployment reference defaults to a version so a fresh clone deploys without editing
      # anything. That default is only trustworthy if it cannot fall behind, so a release may not
      # be cut while it disagrees with the tag being published. Bump it, commit, then tag.
      - name: Check the deployment default matches the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          defaults=$(grep -oP 'INTEGRIOS_VERSION:-\K[^}]+' deploy/compose.yml | sort -u)
          if [[ "$(wc -l <<<"$defaults")" -ne 1 || "$defaults" != "$tag" ]]; then
            echo "deploy/compose.yml defaults to [${defaults//$'\n'/, }] but this release is ${tag}." >&2
            echo "Update the default in deploy/compose.yml, commit, and re-tag." >&2
            exit 1
          fi
          echo "deployment default ${defaults} matches release ${tag}"

      - name: Record release inputs
        if: steps.tier.outputs.name == 'release'
        shell: bash
        run: |
          mkdir -p evidence/test-results
          dotnet --info > evidence/dotnet-info.txt
          docker version > evidence/docker-version.txt
          docker compose version > evidence/docker-compose-version.txt
          dotnet list Integrios.slnx package --include-transitive --format json --no-restore > evidence/dependencies.json
          dotnet list Integrios.slnx package --vulnerable --include-transitive --no-restore > evidence/vulnerability-audit.txt
          cp global.json evidence/global.json
          cp .github/workflows/ci.yml evidence/ci-workflow.yml
          cat > evidence/commands.txt <<'EOF'
          # Architecture/unit/provider tests below ran in this workflow run's verify matrix; see its logs.
          # The full-suite command below ran in this qualify job; see acceptance.log.
          dotnet restore Integrios.slnx --locked-mode
          dotnet list Integrios.slnx package --vulnerable --include-transitive --no-restore
          dotnet build Integrios.slnx --configuration Release --no-restore
          dotnet test tests/Integrios.ArchitectureTests/Integrios.ArchitectureTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Domain.UnitTests/Integrios.Domain.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Application.UnitTests/Integrios.Application.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Infrastructure.UnitTests/Integrios.Infrastructure.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Admin.UnitTests/Integrios.Admin.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Ingestion.UnitTests/Integrios.Ingestion.UnitTests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Worker.UnitTests/Integrios.Worker.UnitTests.csproj --configuration Release --no-build
          INTEGRIOS_TEST_DATABASE_PROVIDER=postgres dotnet test tests/Integrios.Application.FunctionalTests/Integrios.Application.FunctionalTests.csproj --configuration Release --no-build
          INTEGRIOS_TEST_DATABASE_PROVIDER=sqlserver dotnet test tests/Integrios.Application.FunctionalTests/Integrios.Application.FunctionalTests.csproj --configuration Release --no-build
          dotnet test Integrios.slnx --configuration Release --no-restore
          EOF

      - name: Run acceptance tests
        shell: bash
        env:
          TIER: ${{ steps.tier.outputs.name }}
          TARGET: ${{ steps.tier.outputs.target }}
        run: |
          set -o pipefail
          mkdir -p evidence/test-results
          command=(dotnet test "$TARGET" --configuration Release --no-restore --logger trx --results-directory evidence/test-results)

          printf '%q ' "${command[@]}" > evidence/selected-command.txt
          printf '\n' >> evidence/selected-command.txt
          "${command[@]}" 2>&1 | tee evidence/acceptance.log

          python3 - "$TIER" <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          # Expected test counts are deliberately not asserted here. A hand-maintained floor
          # decays every time a test is added. What remains is a presence check that catches the
          # target resolving to no tests.
          tier = sys.argv[1]
          total = 0
          not_executed = 0
          acceptance_results = 0
          files = glob.glob('evidence/test-results/**/*.trx', recursive=True)
          for path in files:
              root = ET.parse(path).getroot()
              counters = root.find('.//{*}Counters')
              if counters is not None:
                  total += int(counters.attrib.get('total', '0'))
                  not_executed += int(counters.attrib.get('notExecuted', '0'))

              acceptance_ids = {
                  test.attrib['id']
                  for test in root.findall('.//{*}UnitTest')
                  if test.attrib.get('storage', '').replace('\\', '/').lower().endswith('/integrios.acceptancetests.dll')
              }
              acceptance_results += sum(
                  1
                  for result in root.findall('.//{*}UnitTestResult')
                  if result.attrib.get('testId') in acceptance_ids
              )

          with open('evidence/test-counts.txt', 'w', encoding='utf-8') as output:
              output.write(
                  f'tier={tier}\n'
                  f'trx_files={len(files)}\n'
                  f'total_tests={total}\n'
                  f'acceptance_tests={acceptance_results}\n'
                  f'not_executed={not_executed}\n'
              )

          if not files or total < 1:
              raise SystemExit(f'{tier} run selected no tests; the target resolved to nothing')
          if acceptance_results < 1:
              raise SystemExit(
                  f'{tier} run executed no tests from the acceptance project; '
                  'the target resolved to nothing'
              )
          if not_executed:
              raise SystemExit(f'{tier} run reported {not_executed} skipped or unexecuted tests')
          PY

      - name: Record resolved external image digests
        if: always() && steps.tier.outputs.name == 'release'
        shell: bash
        run: |
          mapfile -t images < <(
            {
              awk 'toupper($1) == "FROM" { print $2 }' docker/*.Dockerfile
              awk '$1 == "image:" { print $2 }' \
                compose.yml \
                deploy/compose.yml \
                tests/Integrios.AcceptanceTests/compose.acceptance.yml
            } | grep -v '\${' | sort -u
          )

          : > evidence/external-image-digests.txt
          for image in "${images[@]}"; do
            digest=$(docker buildx imagetools inspect --raw "$image" | sha256sum | cut -d' ' -f1)
            printf '%s@sha256:%s\n' "$image" "$digest" >> evidence/external-image-digests.txt
          done

      - name: Upload acceptance evidence
        if: always() && steps.tier.outputs.name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-acceptance-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  package:
    needs: [verify, qualify]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          # One Dockerfile builds every image; the host is selected by build argument, so each
          # published image still contains only its own service. Keep these arguments in step
          # with the same services in compose.yml.
          - name: ingestion
            project: Integrios.Ingestion
            build-args: |
              MOUNT_ROOT=/run/secrets/integrios/source
          - name: admin
            project: Integrios.Admin
            build-args: ''
          - name: worker
            project: Integrios.Worker
            build-args: |
              MOUNT_ROOT=/run/secrets/integrios/destination
              HTTP_PORT=5299
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PROJECT=${{ matrix.service.project }}
            ${{ matrix.service.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image digest
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          SERVICE: ${{ matrix.service.name }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-digest
          {
            printf 'service=%s\n' "$SERVICE"
            printf 'image=%s\n' "$IMAGE"
            printf 'tags=%s\n' "$TAGS"
            printf 'digest=%s\n' "$DIGEST"
          } > "image-digest/$SERVICE.txt"

      - name: Upload image digest
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-digest-${{ matrix.service.name }}-${{ github.run_id }}
          path: image-digest
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  retain-release-evidence:
    needs: [qualify, package]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Download acceptance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-acceptance-${{ github.run_id }}
          path: release-evidence

      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-image-digest-*-${{ github.run_id }}
          path: release-evidence/image-digests
          merge-multiple: true

      - name: Record workflow identity
        shell: bash
        run: |
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'run_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > release-evidence/manifest.txt

      - name: Upload retained release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: release-evidence
          if-no-files-found: error
          overwrite: true
          retention-days: 90
