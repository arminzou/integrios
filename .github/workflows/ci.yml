name: ci

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore Integrios.slnx --locked-mode

      - name: Audit runtime dependencies
        run: dotnet list Integrios.slnx package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build Integrios.slnx --configuration Release --no-restore

      # Unit test projects only. The integration test project needs Postgres and
      # is run out of band, not in this gate.
      - name: Test
        run: |
          dotnet test tests/Integrios.Ingress.Tests/Integrios.Ingress.Tests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Admin.Tests/Integrios.Admin.Tests.csproj --configuration Release --no-build
          dotnet test tests/Integrios.Worker.Tests/Integrios.Worker.Tests.csproj --configuration Release --no-build

  # Build and publish images, only on push to the canonical repo (merges/tags on
  # GitHub). Fork PRs never reach this job, so no secrets are exposed to them.
  package:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # MockSink is a local test/demo aid, not a deployable service, so it is
        # compile-verified in the verify job but never published.
        service:
          - name: ingress
            dockerfile: docker/Ingress.Dockerfile
          - name: admin
            dockerfile: docker/Admin.Dockerfile
          - name: worker
            dockerfile: docker/Worker.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published image digest
        run: echo '${{ matrix.service.name }} ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
