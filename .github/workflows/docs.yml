name: docs

on:
  pull_request:
    paths: ['**.md', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['**.md', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Add excluded-content probe
        run: printf '%s\n' '__PRIVATE_DOC_PROBE__' > docs/__private_doc_probe.local.md
      - run: npm run docs:build
      - name: Check public output
        shell: bash
        run: |
          test -f docs/.vitepress/dist/index.html
          test -f docs/.vitepress/dist/setup.html
          if test -e docs/.vitepress/dist/__private_doc_probe.local.html ||
             grep -R -n '__PRIVATE_DOC_PROBE__' docs/.vitepress/dist; then
            echo 'Excluded documentation appeared in public output' >&2
            exit 1
          fi
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
