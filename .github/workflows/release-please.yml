name: release-please

# Keeps a release pull request open against `main`, reflecting every conventional commit landed
# since the last release: the next version in VERSION and deploy/compose.yml, and the notes in
# CHANGELOG.md. Merging that pull request is the release decision. It does not publish anything;
# pushing the `v*` tag afterwards is what starts the release run in ci.yml.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # The tag and the GitHub release stay manual for now. A tag created here would carry
          # the workflow's own GITHUB_TOKEN, and GitHub does not start a workflow run from an
          # event that token caused, so ci.yml's `push: tags` release run would never fire.
          skip-github-release: true
