services:
  # Swap point for a managed/external Postgres: remove this service and point
  # ConnectionStrings__Postgres at your database instead.
  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrios
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d integrios"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.8.0} # x-release-please-version
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
    command: ["database", "migrate"]

  # Idempotent one-shot: creates the first deployment-wide OperatorKey only when none is live.
  # Production fails closed unless the Operator supplies a secret.
  bootstrap:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.8.0} # x-release-please-version
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET: ${INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET:-}
    command: ["bootstrap"]

  ingestion:
    image: ghcr.io/arminzou/integrios/ingestion:${INTEGRIOS_VERSION:-0.8.0} # x-release-please-version
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      # Broker Sources using azure_identity draw an ambient credential through
      # DefaultAzureCredential. Nothing below is set by default, so the working scheme out of the
      # box is connection_string. To use azure_identity, give this container a credential the chain
      # can resolve: attach a managed identity (AKS/Container Apps/VM), or supply an app
      # registration through AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET. The identity
      # needs the "Azure Service Bus Data Receiver" role on the namespace - subscription Owner does
      # not grant data-plane access.
      # AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      # AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      # AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    # Key-per-file configuration: each file name is a configuration key with "__" as the section
    # separator, e.g. SourceSecrets__<tenant-slug>__<secret-reference>. Read once at startup.
    volumes:
      - ${INTEGRIOS_SOURCE_SECRETS_DIR:-./secrets/sources}:/run/secrets/integrios:ro
    ports:
      - "${INTEGRIOS_INGESTION_PORT:-5231}:8080"
      - "127.0.0.1:${INTEGRIOS_INGESTION_OPERATIONAL_PORT:-5232}:5299"

  admin:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.8.0} # x-release-please-version
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      Integrios__PublicIngestionBaseUri: ${INTEGRIOS_PUBLIC_INGESTION_BASE_URI}
      # Either OIDC or password sign-in serves the dashboard. With both unset/disabled, Admin stays
      # machine-only. Password values are created interactively and never carried by Compose.
      Integrios__Admin__Oidc__Authority: ${INTEGRIOS_ADMIN_OIDC_AUTHORITY:-}
      Integrios__Admin__Oidc__ClientId: ${INTEGRIOS_ADMIN_OIDC_CLIENT_ID:-}
      Integrios__Admin__Oidc__ClientSecret: ${INTEGRIOS_ADMIN_OIDC_CLIENT_SECRET:-}
      Integrios__Admin__Oidc__DisplayName: ${INTEGRIOS_ADMIN_OIDC_DISPLAY_NAME:-OpenID Connect}
      Integrios__Admin__Password__Enabled: ${INTEGRIOS_ADMIN_PASSWORD_ENABLED:-false}
      Integrios__Admin__DataProtection__KeyRingPath: /var/lib/integrios/data-protection
    volumes:
      - admin_data_protection:/var/lib/integrios/data-protection
    ports:
      - "${INTEGRIOS_ADMIN_PORT:-5150}:8080"
      - "127.0.0.1:${INTEGRIOS_ADMIN_OPERATIONAL_PORT:-5151}:5299"

  worker:
    image: ghcr.io/arminzou/integrios/worker:${INTEGRIOS_VERSION:-0.8.0} # x-release-please-version
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      # Completed-history retention is destructive and disabled by absence. To opt in, set a
      # period of at least seven days, then uncomment the mapping below.
      # Integrios__Worker__HistoryRetention__Period: ${INTEGRIOS_HISTORY_RETENTION_PERIOD}
    # Key-per-file configuration, e.g. DestinationSecrets__<tenant-slug>__<secret-reference>.
    volumes:
      - ${INTEGRIOS_DESTINATION_SECRETS_DIR:-./secrets/destinations}:/run/secrets/integrios:ro
    ports:
      - "127.0.0.1:${INTEGRIOS_WORKER_METRICS_PORT:-5299}:5299"

volumes:
  postgres_data:
  admin_data_protection:
