services:
  # Swap point for a managed/external Postgres: remove this service and point
  # FLYWAY_URL / ConnectionStrings__Postgres at your database instead.
  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrios
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d integrios"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:10.22.0
    depends_on:
      postgres:
        condition: service_healthy
    # Paths assume this file runs from a checkout of a tagged release. If you copy deploy/
    # out of the repo, copy db/ alongside it.
    volumes:
      - ../db/migrations:/flyway/sql
      - ../db/flyway.toml:/flyway/conf/flyway.toml
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/integrios
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    command: migrate

  # Idempotent one-shot: creates the built-in catalog and, only if no live deployment-wide AdminKey
  # exists, the first admin key. Production fails closed unless the Operator supplies a secret.
  bootstrap:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.2.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      INTEGRIOS_BOOTSTRAP_ADMIN_SECRET: ${INTEGRIOS_BOOTSTRAP_ADMIN_SECRET:-}
    command: ["bootstrap"]

  ingress:
    image: ghcr.io/arminzou/integrios/ingress:${INTEGRIOS_VERSION:-0.2.0}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Integrios__SourceSecrets__Provider: ${INTEGRIOS_SOURCE_SECRETS_PROVIDER:-file}
    volumes:
      - ${INTEGRIOS_SOURCE_SECRETS_DIR:-./secrets/source}:/run/secrets/integrios/source:ro
    ports:
      - "${INTEGRIOS_INGRESS_PORT:-5231}:8080"

  admin:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.2.0}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Integrios__PublicIngressBaseUri: ${INTEGRIOS_PUBLIC_INGRESS_BASE_URI}
    ports:
      - "${INTEGRIOS_ADMIN_PORT:-5150}:8080"

  worker:
    image: ghcr.io/arminzou/integrios/worker:${INTEGRIOS_VERSION:-0.2.0}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Integrios__DestinationSecrets__Provider: ${INTEGRIOS_DESTINATION_SECRETS_PROVIDER:-file}
    volumes:
      - ${INTEGRIOS_DESTINATION_SECRETS_DIR:-./secrets/destination}:/run/secrets/integrios/destination:ro

volumes:
  postgres_data:
