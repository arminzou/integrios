services:
  # Swap point for a managed/external Postgres: remove this service and point
  # ConnectionStrings__Postgres at your database instead.
  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrios
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d integrios"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.3.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
    command: ["database", "migrate"]

  # Idempotent one-shot: creates the first deployment-wide OperatorKey only when none is live.
  # Production fails closed unless the Operator supplies a secret.
  bootstrap:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.3.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET: ${INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET:-}
    command: ["bootstrap"]

  ingestion:
    image: ghcr.io/arminzou/integrios/ingestion:${INTEGRIOS_VERSION:-0.3.0}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      Integrios__SourceSecrets__Provider: ${INTEGRIOS_SOURCE_SECRETS_PROVIDER:-file}
      # Queue Sources using azure_identity draw an ambient credential through
      # DefaultAzureCredential. Nothing below is set by default, so the working scheme out of the
      # box is connection_string. To use azure_identity, give this container a credential the chain
      # can resolve: attach a managed identity (AKS/Container Apps/VM), or supply an app
      # registration through AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET. The identity
      # needs the "Azure Service Bus Data Receiver" role on the namespace - subscription Owner does
      # not grant data-plane access.
      # AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      # AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      # AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    volumes:
      - ${INTEGRIOS_SOURCE_SECRETS_DIR:-./secrets/source}:/run/secrets/integrios/source:ro
    ports:
      - "${INTEGRIOS_INGESTION_PORT:-5231}:8080"

  admin:
    image: ghcr.io/arminzou/integrios/admin:${INTEGRIOS_VERSION:-0.3.0}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      Integrios__PublicIngestionBaseUri: ${INTEGRIOS_PUBLIC_INGESTION_BASE_URI}
    ports:
      - "${INTEGRIOS_ADMIN_PORT:-5150}:8080"

  worker:
    image: ghcr.io/arminzou/integrios/worker:${INTEGRIOS_VERSION:-0.3.0}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
      Integrios__DestinationSecrets__Provider: ${INTEGRIOS_DESTINATION_SECRETS_PROVIDER:-file}
    volumes:
      - ${INTEGRIOS_DESTINATION_SECRETS_DIR:-./secrets/destination}:/run/secrets/integrios/destination:ro

volumes:
  postgres_data:
