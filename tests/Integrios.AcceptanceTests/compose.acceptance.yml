services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - "${INTEGRIOS_OTEL_CONFIG}:/etc/otelcol-contrib/config.yaml:ro"
      - "${INTEGRIOS_OTEL_ARTIFACTS_DIR}:/var/lib/otelcol"

  postgres:
    ports:
      - "${INTEGRIOS_POSTGRES_PORT}:5432"
    # The qualification harness uses this Linux container to create a real POSIX FIFO and read
    # collector output without contending with Windows host file-sharing semantics.
    volumes:
      - "${INTEGRIOS_DESTINATION_SECRETS_DIR}:/var/lib/integrios-qualification/secrets"
      - "${INTEGRIOS_OTEL_ARTIFACTS_DIR}:/var/lib/integrios-qualification/otel:ro"

  bootstrap:
    # These explicit tags are also assigned by the development Compose build. The deployment
    # phase therefore reuses the exact local images without relying on Compose's implicit naming.
    image: ${INTEGRIOS_ADMIN_IMAGE}

  migrate:
    image: ${INTEGRIOS_ADMIN_IMAGE}

  ingress:
    image: ${INTEGRIOS_INGRESS_IMAGE}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  admin:
    image: ${INTEGRIOS_ADMIN_IMAGE}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  worker:
    image: ${INTEGRIOS_WORKER_IMAGE}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DestinationSecrets__qualification-config__shared_secret: ${INTEGRIOS_QUALIFICATION_CONFIG_SHARED_SECRET:-}
      DestinationSecrets__qualification-config__config_only: ${INTEGRIOS_QUALIFICATION_CONFIG_ONLY_SECRET:-}
      # Compressed cadence. The retry, dead-letter, replay, and timeout state machines are
      # identical to production; only the wall-clock between transitions is shortened, so the
      # matrix spends its time asserting rather than sleeping. LeaseDuration keeps its production
      # value because the two-minute lease is itself an acceptance criterion.
      Integrios__Delivery__HttpTimeout: "00:00:05"
      Integrios__Delivery__AttemptDeadline: "00:00:15"
      Integrios__Worker__FanoutLoop__IdlePollInterval: "00:00:00.250"
      Integrios__Worker__DeliveryLoop__IdlePollInterval: "00:00:00.250"
      Integrios__Delivery__Retry__BaseDelay: "00:00:02"
    ports:
      - "${INTEGRIOS_WORKER_METRICS_PORT}:5299"

  mocksink:
    image: ${INTEGRIOS_MOCKSINK_IMAGE}
    ports:
      - "${INTEGRIOS_MOCKSINK_PORT}:8080"
