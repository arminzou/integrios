services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - "${INTEGRIOS_OTEL_CONFIG}:/etc/otelcol-contrib/config.yaml:ro"
      - "${INTEGRIOS_OTEL_ARTIFACTS_DIR}:/var/lib/otelcol"

  postgres:
    ports:
      - "${INTEGRIOS_POSTGRES_PORT}:5432"
    # The acceptance harness uses this Linux container to read collector output without
    # contending with Windows host file-sharing semantics.
    volumes:
      - "${INTEGRIOS_OTEL_ARTIFACTS_DIR}:/var/lib/integrios-acceptance/otel:ro"

  setup:
    image: ${INTEGRIOS_IMAGE}

  ingestion:
    image: ${INTEGRIOS_IMAGE}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=acceptance
      OTEL_TRACES_SAMPLER: always_on

  admin:
    image: ${INTEGRIOS_IMAGE}
    environment:
      # The harness connects directly over local HTTP; real production deployments keep HTTPS required.
      Integrios__Admin__Oidc__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=acceptance
      OTEL_TRACES_SAMPLER: always_on

  worker:
    image: ${INTEGRIOS_IMAGE}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=acceptance
      OTEL_TRACES_SAMPLER: always_on
      DestinationSecrets__acceptance-config__shared-secret: ${INTEGRIOS_ACCEPTANCE_CONFIG_SHARED_SECRET:-}
      DestinationSecrets__acceptance-config__config-only: ${INTEGRIOS_ACCEPTANCE_CONFIG_ONLY_SECRET:-}
      # Compressed cadence. The retry, dead-letter, replay, and timeout state machines are
      # identical to production; only the wall-clock between transitions is shortened, so the
      # matrix spends its time asserting rather than sleeping. LeaseDuration keeps its production
      # value because the two-minute lease is itself an acceptance criterion.
      Integrios__Delivery__HttpTimeout: "00:00:05"
      Integrios__Delivery__AttemptDeadline: "00:00:15"
      Integrios__Worker__FanoutLoop__IdlePollInterval: "00:00:00.250"
      Integrios__Worker__DeliveryLoop__IdlePollInterval: "00:00:00.250"
      Integrios__Delivery__Retry__BaseDelay: "00:00:02"
  subscriber:
    image: ${INTEGRIOS_IMAGE}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=acceptance
      OTEL_TRACES_SAMPLER: always_on
