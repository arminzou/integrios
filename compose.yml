services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrios
      POSTGRES_USER: ${POSTGRES_USER:-integrios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integrios_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integrios} -d integrios"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
      - ./db/flyway.toml:/flyway/conf/flyway.toml
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/integrios
      FLYWAY_USER: ${POSTGRES_USER:-integrios}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-integrios_dev}
    command: migrate

  bootstrap:
    # Same command as production. What makes this stack dev-only is the well-known dev secret
    # defaulted below (override via .env / INTEGRIOS_BOOTSTRAP_ADMIN_SECRET), plus the bundled
    # MockSink/Grafana. Never deploy this compose file unchanged to a public/prod environment;
    # see deploy/ for the production reference.
    build:
      context: .
      dockerfile: docker/Admin.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
      DOTNET_ENVIRONMENT: Development
      INTEGRIOS_BOOTSTRAP_ADMIN_SECRET: ${INTEGRIOS_BOOTSTRAP_ADMIN_SECRET:-admin_bootstrap_secret}
    command: ["bootstrap"]

  ingress:
    build:
      context: .
      dockerfile: docker/Ingress.Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
    ports:
      - "5231:8080"

  admin:
    build:
      context: .
      dockerfile: docker/Admin.Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
    ports:
      - "5150:8080"

  worker:
    build:
      context: .
      dockerfile: docker/Worker.Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}

  mocksink:
    build:
      context: .
      dockerfile: docker/MockSink.Dockerfile
    ports:
      - "5054:8080"

  # Prometheus and Grafana below are a local development convenience only.
  # The platform bundles no observability backend; operators point it at their own stack.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
