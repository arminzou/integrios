services:
  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrios
      POSTGRES_USER: ${POSTGRES_USER:-integrios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integrios_dev}
    ports:
      - "${INTEGRIOS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integrios} -d integrios"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Admin
    image: ${INTEGRIOS_BOOTSTRAP_IMAGE:-integrios-bootstrap:dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
    command: ["database", "migrate"]

  bootstrap:
    # Same command as production. What makes this stack dev-only is the well-known dev secret
    # defaulted below (override via .env / INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET), plus the bundled
    # WireMock/Grafana. Never deploy this compose file unchanged to a public/prod environment;
    # see deploy/ for the production reference.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Admin
    image: ${INTEGRIOS_BOOTSTRAP_IMAGE:-integrios-bootstrap:dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
      DOTNET_ENVIRONMENT: Development
      INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET: ${INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET:-operator_bootstrap_secret}
    command: ["bootstrap"]

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Ingestion
        MOUNT_ROOT: /run/secrets/integrios/source
    image: ${INTEGRIOS_INGESTION_IMAGE:-integrios-ingestion:dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
      Integrios__SourceSecrets__Provider: ${INTEGRIOS_SOURCE_SECRETS_PROVIDER:-file}
    volumes:
      - ${INTEGRIOS_SOURCE_SECRETS_DIR:-./secrets/source}:/run/secrets/integrios/source:ro
    ports:
      - "${INTEGRIOS_INGESTION_PORT:-5231}:8080"

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Admin
    image: ${INTEGRIOS_ADMIN_IMAGE:-integrios-admin:dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
      DOTNET_ENVIRONMENT: Development
      Integrios__PublicIngestionBaseUri: ${INTEGRIOS_PUBLIC_INGESTION_BASE_URI:-http://localhost:5231}
    ports:
      - "${INTEGRIOS_ADMIN_PORT:-5150}:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Worker
        MOUNT_ROOT: /run/secrets/integrios/destination
        HTTP_PORT: "5299"
    image: ${INTEGRIOS_WORKER_IMAGE:-integrios-worker:dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
      Integrios__DestinationSecrets__Provider: ${INTEGRIOS_DESTINATION_SECRETS_PROVIDER:-file}
    volumes:
      - ${INTEGRIOS_DESTINATION_SECRETS_DIR:-./secrets/destination}:/run/secrets/integrios/destination:ro

  mocksink:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating"]
    volumes:
      - ./tests/Integrios.AcceptanceTests/wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      - "${INTEGRIOS_MOCKSINK_PORT:-5054}:8080"

  # Prometheus and Grafana below are a local development convenience only.
  # The platform bundles no observability backend; operators point it at their own stack.
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.4.6
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
