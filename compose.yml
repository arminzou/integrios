services:
  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: integrios
      POSTGRES_USER: ${POSTGRES_USER:-integrios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integrios_dev}
    ports:
      - "${INTEGRIOS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integrios} -d integrios"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Admin
    image: ${INTEGRIOS_BOOTSTRAP_IMAGE:-integrios-bootstrap:dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
    command: ["database", "migrate"]

  grant-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Admin
    image: ${INTEGRIOS_BOOTSTRAP_IMAGE:-integrios-bootstrap:dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=${POSTGRES_USER:-integrios};Password=${POSTGRES_PASSWORD:-integrios_dev}
      Database__RuntimePrincipals__0__Name: admin_runtime
      Database__RuntimePrincipals__0__Scope: control-plane
      Database__RuntimePrincipals__0__Password: ${INTEGRIOS_ADMIN_RUNTIME_PASSWORD:-admin_runtime_dev}
      Database__RuntimePrincipals__1__Name: data_runtime
      Database__RuntimePrincipals__1__Scope: data-plane
      Database__RuntimePrincipals__1__Password: ${INTEGRIOS_DATA_RUNTIME_PASSWORD:-data_runtime_dev}
    command: ["database", "grant-runtime"]

  bootstrap:
    # Same command as production. The runtime grant job precedes Bootstrap; the bundled
    # WireMock/Grafana and disposable credential defaults make this stack dev-only.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Admin
    image: ${INTEGRIOS_BOOTSTRAP_IMAGE:-integrios-bootstrap:dev}
    depends_on:
      grant-runtime:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=admin_runtime;Password=${INTEGRIOS_ADMIN_RUNTIME_PASSWORD:-admin_runtime_dev}
      DOTNET_ENVIRONMENT: Development
      INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET: ${INTEGRIOS_BOOTSTRAP_OPERATOR_KEY_SECRET:-operator_bootstrap_secret}
    command: ["bootstrap"]

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Ingestion
    image: ${INTEGRIOS_INGESTION_IMAGE:-integrios-ingestion:dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=data_runtime;Password=${INTEGRIOS_DATA_RUNTIME_PASSWORD:-data_runtime_dev}
      DOTNET_ENVIRONMENT: Development
    # Key-per-file configuration: each file name is a configuration key with "__" as the section
    # separator, e.g. SourceSecrets__<tenant-slug>__<secret-reference>. Read once at startup.
    volumes:
      - ${INTEGRIOS_SOURCE_SECRETS_DIR:-./secrets/sources}:/run/secrets/integrios:ro
    ports:
      - "${INTEGRIOS_INGESTION_PORT:-5231}:8080"
      - "${INTEGRIOS_INGESTION_OPERATIONAL_PORT:-5232}:5299"

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Admin
        # Only this image builds and carries the Operator dashboard.
        DASHBOARD: admin
    image: ${INTEGRIOS_ADMIN_IMAGE:-integrios-admin:dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=admin_runtime;Password=${INTEGRIOS_ADMIN_RUNTIME_PASSWORD:-admin_runtime_dev}
      DOTNET_ENVIRONMENT: Development
      Integrios__PublicIngestionBaseUri: ${INTEGRIOS_PUBLIC_INGESTION_BASE_URI:-http://localhost:5231}
      # Either OIDC or password sign-in serves the dashboard. With both unset/disabled, Admin stays
      # machine-only. Password values are created interactively and never carried by Compose.
      Integrios__Admin__Oidc__Authority: ${INTEGRIOS_ADMIN_OIDC_AUTHORITY:-}
      Integrios__Admin__Oidc__ClientId: ${INTEGRIOS_ADMIN_OIDC_CLIENT_ID:-}
      Integrios__Admin__Oidc__ClientSecret: ${INTEGRIOS_ADMIN_OIDC_CLIENT_SECRET:-}
      Integrios__Admin__Oidc__DisplayName: ${INTEGRIOS_ADMIN_OIDC_DISPLAY_NAME:-OpenID Connect}
      Integrios__Admin__Password__Enabled: ${INTEGRIOS_ADMIN_PASSWORD_ENABLED:-false}
      Integrios__Admin__DataProtection__KeyRingPath: /var/lib/integrios/data-protection
    volumes:
      - admin_data_protection:/var/lib/integrios/data-protection
    ports:
      - "${INTEGRIOS_ADMIN_PORT:-5150}:8080"
      - "${INTEGRIOS_ADMIN_OPERATIONAL_PORT:-5151}:5299"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Integrios.Worker
        HTTP_PORT: "5299"
    image: ${INTEGRIOS_WORKER_IMAGE:-integrios-worker:dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=integrios;Username=data_runtime;Password=${INTEGRIOS_DATA_RUNTIME_PASSWORD:-data_runtime_dev}
      DOTNET_ENVIRONMENT: Development
      # Completed-history retention is destructive and disabled by absence. To opt in, set a
      # period of at least seven days, then uncomment the mapping below.
      # Integrios__Worker__HistoryRetention__Period: ${INTEGRIOS_HISTORY_RETENTION_PERIOD}
    # Key-per-file configuration, e.g. DestinationSecrets__<tenant-slug>__<secret-reference>.
    volumes:
      - ${INTEGRIOS_DESTINATION_SECRETS_DIR:-./secrets/destinations}:/run/secrets/integrios:ro
    ports:
      - "${INTEGRIOS_WORKER_METRICS_PORT:-5299}:5299"

  mocksink:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating"]
    volumes:
      - ./tests/Integrios.AcceptanceTests/wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      - "${INTEGRIOS_MOCKSINK_PORT:-5054}:8080"

  servicebus-sql:
    profiles: ["queue-demo"]
    image: mcr.microsoft.com/azure-sql-edge:2.0.0
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${INTEGRIOS_SERVICEBUS_SQL_PASSWORD:-Integrios_dev1!}

  servicebus-emulator:
    profiles: ["queue-demo"]
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    depends_on:
      - servicebus-sql
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${INTEGRIOS_SERVICEBUS_SQL_PASSWORD:-Integrios_dev1!}
    volumes:
      - ./infra/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${INTEGRIOS_SERVICEBUS_PORT:-5672}:5672"
      - "${INTEGRIOS_SERVICEBUS_HTTP_PORT:-5300}:5300"

  # Prometheus and Grafana below are a local development convenience only.
  # The platform bundles no observability backend; operators point it at their own stack.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.6
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  admin_data_protection:
