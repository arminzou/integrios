# Dev-convenience Prometheus config. Operators bring their own in production.
# Targets use Compose service names and in-container ports (not host-published ports):
# Every host serves its operational endpoints on the internal 5299 listener.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: integrios-ingestion
    static_configs:
      - targets: ["ingestion:5299"]

  - job_name: integrios-admin
    static_configs:
      - targets: ["admin:5299"]

  - job_name: integrios-worker
    static_configs:
      - targets: ["worker:5299"]
